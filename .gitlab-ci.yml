stages:
  - test
  - release

test:
  stage: test
  image: oven/bun:1.4
  script:
    - bun install --frozen-lockfile
    - bun run typecheck
    - bun run lint
    - bun run build
    - bun test
  rules:
    - if: $CI_PIPELINE_SOURCE
      when: always

release-docker:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker buildx create --name sendBuilder --use || docker buildx use sendBuilder
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        IMAGE_NAMES="$CI_REGISTRY_IMAGE/mr:$CI_MERGE_REQUEST_IID"
      elif [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_NAMES="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG $CI_REGISTRY_IMAGE:latest"
      else
        IMAGE_NAMES="$CI_REGISTRY_IMAGE/$CI_COMMIT_BRANCH:$CI_COMMIT_SHORT_SHA"
      fi
    - |
      for image in $IMAGE_NAMES; do
        docker buildx build --platform linux/amd64,linux/arm64 -t "$image" . --push
      done
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
